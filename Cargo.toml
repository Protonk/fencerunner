[package]
name = "fencerunner"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
description = "Portable script harness to determine ambient permissions by testing them directly."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/Protonk/fencerunner"
default-run = "fencerunner"
autobins = false
# No build script; runner-owned assets are embedded and materialized at runtime.

[workspace]
members = ["xtask"]
default-members = ["."]

[lib]
name = "fencerunner"
doctest = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
libc = "0.2"
jsonschema = "0.17"

[dev-dependencies]

[[bin]]
name = "fencerunner"
path = "src/bin/fencerunner.rs"
test = false
